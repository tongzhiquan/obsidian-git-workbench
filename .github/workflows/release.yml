name: Release

on:
  push:
    tags:
      - 'v[0-9]*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release, for example 0.1.4 or v0.1.4
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate, test and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      archive: ${{ steps.prepare.outputs.archive }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Validate release metadata and extract changelog
        id: prepare
        run: node scripts/prepare-release.mjs "$RELEASE_TAG" "$RUNNER_TEMP/release-notes.md"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build and package
        run: npm run package

      - name: Include release notes
        run: cp "$RUNNER_TEMP/release-notes.md" release/release-notes.md

      - name: Save release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ steps.prepare.outputs.version }}
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
      RELEASE_ARCHIVE: ${{ needs.build.outputs.archive }}
    steps:
      - name: Download tested release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.build.outputs.version }}
          path: release

      - name: Upload assets and publish
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            release/main.js
            release/manifest.json
            release/styles.css
            release/LICENSE
            release/THIRD-PARTY-LICENSES.txt
            "release/$RELEASE_ARCHIVE"
          )
          for asset in "${assets[@]}" release/release-notes.md; do
            test -s "$asset"
          done

          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft'); then
            if [[ "$draft" != true ]]; then
              echo "Release $RELEASE_TAG is already published; refusing to replace its assets." >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Git Workbench $RELEASE_VERSION" \
              --notes-file release/release-notes.md
          fi

          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          gh release edit "$RELEASE_TAG" --draft=false \
            --title "Git Workbench $RELEASE_VERSION" \
            --notes-file release/release-notes.md
